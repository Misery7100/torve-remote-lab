schema_version: 1
runtime:
  network: host              # this host's egress runs through a local proxy
store:
  adapter: postgres          # D-3.6: real runs take the durable store
  dsn_env: TORVE_PG_DSN      # the DSN itself lives in the operator's env
promotion:
  require_ci: true
  auto_merge: true           # the D-6.2 opt-in — the tick's lane leg runs here
  approvals: 1               # a landing needs one commander approval of the tip
  require_review: true       # A-43 (D-6.14): the lane lands only a reviewed run
loop:
  dispatch_workers: 2        # A-39: scope-disjoint tasks may share a tick;
                             # anything provably shared still serializes
scm:
  open_pr: true
  repo: Misery7100/torve-remote-lab
  token_env: GITHUB_TOKEN
tracker:
  kind: github-issues
  repo: Misery7100/torve-remote-lab
  token_env: GITHUB_TOKEN
  notify: Misery7100         # paged on interrupt-class escalations (D-6.4)
  commanders: [Misery7100]   # the only login whose /torve commands apply
review:
  "on": [task_gated, pr_opened, pr_synchronized]
  feedback_from:             # the revision loop's allow-list (0005 §4a)
    - "coderabbitai[bot]"
    - Misery7100
tiers:
  # Drafter and executor run the native DeepSeek harness (dsh): the
  # 2026-08-28 shadow campaign measured it 8/8 green at attempt 1 on the
  # same model once the headless profile was configured — model overlay
  # baked in the image, permission mode as the operator knob. The reviewer
  # stays on opencode: a cross-harness pair on one model keeps review
  # independent of the executor's harness quirks.
  planner:
    adapter: harness
    command: 'HOME=/tmp DSH_PERMISSION_MODE=danger-full-access dsh --profile headless --patch /opt/dsh/deepseek-chat.yml "$(cat {prompt})"'
    model: deepseek-chat
    provider: deepseek
    api_key_env: [DEEPSEEK_API_KEY]
    image: torve-agent:dsh
  executor:
    adapter: harness
    command: 'HOME=/tmp DSH_PERMISSION_MODE=danger-full-access dsh --profile headless --patch /opt/dsh/deepseek-chat.yml "$(cat {prompt})"'
    model: deepseek-chat
    provider: deepseek
    api_key_env: [DEEPSEEK_API_KEY]
    image: torve-agent:dsh
  reviewer:
    adapter: harness
    command: 'HOME=/tmp opencode run -m deepseek/{model} "$(cat {prompt})"'
    model: deepseek-chat
    provider: deepseek
    api_key_env: [DEEPSEEK_API_KEY]
    image: torve-agent:opencode
providers:
  default: [deepseek]
  repositories: {}
  never_send: []
