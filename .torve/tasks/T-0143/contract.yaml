# Adopted from T-0140's drafts (RFC 0020) — ids minted at adoption, D-20.4.
schema_version: 1
id: T-0143
role: implement
intent: 'Add a new src/lab/humanize.py module with two formatting functions: format_bytes
  converts a non-negative byte count into a human string using binary units (1024
  multiplier), e.g. 1536 -> ''1.5 KiB'', keeping one decimal place and dropping a
  trailing ''.0'' so whole values render like ''512 B''; format_seconds renders a
  non-negative whole-second count as a compact duration string (3661 -> ''1h 1m 1s'',
  omitting zero-valued components, 0 -> ''0s''). Both functions raise ValueError for
  negative inputs and follow the existing stdlib-only, small-pure-function module
  style.'
depends_on: []
scope:
  allow:
  - src/lab/humanize.py
  - tests/test_humanize.py
  deny: []
acceptance:
- python3 -m unittest discover -s tests -v
decisions: []
tier: executor
