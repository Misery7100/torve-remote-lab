# Adopted from T-0137's drafts (RFC 0020) — ids minted at adoption, D-20.4.
schema_version: 1
id: T-0138
role: implement
intent: Add a byte-size utility to the lab package so demos can print human-readable
  binary byte counts instead of raw numbers. A new module, src/lab/bytelite.py, formats
  a non-negative integer byte count as a binary string (B, KiB, MiB, GiB, TiB) with
  one decimal place except for plain bytes ('512 B' stays whole, larger counts like
  '1.5 KiB' and '2.0 MiB' keep one decimal), and parses those strings back, accepting
  the same unit spellings case-insensitively with or without a separating space while
  rejecting negatives, unknown units, and malformed numbers with ValueError. Formatting
  and parsing must round-trip within rounding tolerance. A matching test file exercises
  formatting rules, parser rejections, case/space flexibility, boundary values, and
  round-tripping over a spread of counts, following the existing lab module and unittest
  conventions.
depends_on: []
scope:
  allow:
  - src/lab/bytelite.py
  - tests/test_bytelite.py
  deny: []
acceptance:
- python3 -m unittest discover -s tests -v
decisions: []
tier: executor
