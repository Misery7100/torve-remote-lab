  \ \u2014 a byte count to a human string using binary units (1536 -> 1.5 KiB, one\
  \ decimal, trailing .0 dropped) and a seconds count to a compact duration string\
  \ (3661 -> 1h 1m 1s, zero components omitted, 0 -> 0s), both refusing negatives\
  \ with ValueError. Follow the existing module style: stdlib only, small pure functions,\
  \ unittest tests mirroring tests/test_*.py conventions."
