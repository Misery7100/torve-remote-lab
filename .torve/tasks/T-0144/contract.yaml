  \ to a compiled re internally is fine. Second draft, depending on the first: src/lab/treefilter.py\
  \ \u2014 filter_paths(paths, allow, deny) importing lab.pathspec: a path is kept\
  \ when it matches any allow pattern (an empty allow list keeps everything) and matches\
  \ no deny pattern \u2014 deny wins over allow; input order is preserved and each\
  \ draft carries its own unittest test file following the existing tests/test_*.py\
  \ conventions."
