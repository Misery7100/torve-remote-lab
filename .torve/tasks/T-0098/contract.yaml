schema_version: 1
id: T-0098
role: implement
intent: >-
  Create a new module src/lab/intervals.py operating on half-open
  integer intervals (start, end) with start < end: merge_intervals
  (iterable of tuples -> sorted list of disjoint tuples, adjacent
  intervals like (1,3),(3,5) merging into (1,5)) and
  subtract_intervals(base, holes) -> the sorted disjoint parts of the
  merged base not covered by the merged holes, including partial
  overlaps splitting an interval in two. Both validate their inputs:
  a tuple with start >= end raises ValueError. Empty inputs are
  legal; results are always sorted, disjoint, and non-adjacent.
  Stdlib only. Add unittest coverage in a new file
  tests/test_intervals.py — overlap, adjacency, containment, hole
  splitting an interval, holes covering everything, empty inputs,
  and validation. Do not modify any existing file.
scope:
  allow:
    - "src/lab/intervals.py"
    - "tests/test_intervals.py"
  deny: []
acceptance:
  - python3 -m unittest discover -s tests -v
decisions: []
tier: executor
