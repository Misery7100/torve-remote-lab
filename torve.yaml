schema_version: 1
runtime:
  network: host              # this host's egress runs through a local proxy
promotion:
  require_ci: true
scm:
  open_pr: true
  repo: Misery7100/torve-remote-lab
  token_env: GITHUB_TOKEN
tracker:
  kind: github-issues
  repo: Misery7100/torve-remote-lab
  token_env: GITHUB_TOKEN
  notify: Misery7100         # paged on interrupt-class escalations (D-6.4)
review:
  "on": [task_gated, pr_opened, pr_synchronized]
tiers:
  planner: {adapter: fake}
  executor:
    adapter: harness
    command: 'HOME=/tmp opencode run -m deepseek/{model} "$(cat {prompt})"'
    model: deepseek-chat
    provider: deepseek
    api_key_env: [DEEPSEEK_API_KEY]
    image: torve-agent:opencode
  reviewer:
    adapter: harness
    command: 'HOME=/tmp opencode run -m deepseek/{model} "$(cat {prompt})"'
    model: deepseek-chat
    provider: deepseek
    api_key_env: [DEEPSEEK_API_KEY]
    image: torve-agent:opencode
providers:
  default: [deepseek]
  repositories: {}
  never_send: []
